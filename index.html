<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>双模式扫雷</title>
    <style>
        *{box-sizing:border-box;font-family:system-ui}
        body{display:flex;flex-direction:column;align-items:center;background:#f3f3f3;margin-top:20px}
        .control{margin-bottom:12px;gap:10px;display:flex}
        button{padding:8px 16px;font-size:16px;border:none;border-radius:6px;cursor:pointer}
        #flagBtn{background:#ff6b6b;color:white}
        #resetBtn{background:#4285F4;color:white}
        .tip{margin-bottom:8px;font-size:17px}
        table{border-collapse:collapse}
        td{
            width:44px;height:44px;text-align:center;
            border:2px solid #888;
            background:#c8c8c8;
            font-weight:bold;font-size:20px;
            cursor:pointer;user-select:none
        }
        td.open{background:#fff}
        td.flag{color:red}
    </style>
</head>
<body>
    <div class="tip" id="modeTip">当前：正常点开模式</div>
    <div class="control">
        <button id="flagBtn">切换标记雷模式</button>
        <button id="resetBtn">重新开始</button>
    </div>
    <div id="container"></div>
    <script>
        const ROW = 10, COL = 10, MINE = 10;
        let grid = [], mine = [], opened = [], flagged = [];
        let isFlagMode = false;
        let gameOver = false;

        const tipEl = document.getElementById("modeTip");
        const flagBtn = document.getElementById("flagBtn");
        const resetBtn = document.getElementById("resetBtn");
        const container = document.getElementById("container");

        function initGame(){
            gameOver = false;
            isFlagMode = false;
            tipEl.innerText = "当前：正常点开模式";
            container.innerHTML = "";
            grid = Array.from({length:ROW},()=>Array(COL).fill(0));
            mine = Array.from({length:ROW},()=>Array(COL).fill(false));
            opened = Array.from({length:ROW},()=>Array(COL).fill(false));
            flagged = Array.from({length:ROW},()=>Array(COL).fill(false));

            // 随机埋雷
            let placed = 0;
            while(placed < MINE){
                let r = Math.floor(Math.random()*ROW);
                let c = Math.floor(Math.random()*COL);
                if(!mine[r][c]){ mine[r][c]=true; placed++; }
            }
            // 填充数字
            for(let r=0;r<ROW;r++){
                for(let c=0;c<COL;c++){
                    if(mine[r][c]) continue;
                    let cnt = 0;
                    for(let dr=-1;dr<=1;dr++)
                        for(let dc=-1;dc<=1;dc++){
                            let nr=r+dr, nc=c+dc;
                            if(nr>=0&&nr<ROW&&nc>=0&&nc<COL&&mine[nr][nc]) cnt++;
                        }
                    grid[r][c] = cnt;
                }
            }
            renderBoard();
        }

        function checkWin(){
            for(let r=0;r<ROW;r++)
                for(let c=0;c<COL;c++)
                    if(mine[r][c] && !flagged[r][c]) return false;
            return true;
        }

        function open(r,c){
            if(r<0||r>=ROW||c<0||c>=COL) return;
            if(opened[r][c] || flagged[r][c]) return;
            opened[r][c] = true;
            if(grid[r][c]===0){
                for(let dr=-1;dr<=1;dr++)
                    for(let dc=-1;dc<=1;dc++) open(r+dr,c+dc);
            }
        }

        function renderBoard(){
            let tbl = document.createElement("table");
            for(let r=0;r<ROW;r++){
                let tr = document.createElement("tr");
                for(let c=0;c<COL;c++){
                    let td = document.createElement("td");
                    td.dataset.r = r; td.dataset.c = c;
                    if(opened[r][c]){
                        td.classList.add("open");
                        if(grid[r][c]>0) td.innerText = grid[r][c];
                    }else if(flagged[r][c]){
                        td.classList.add("flag");
                        td.innerText = "🚩";
                    }
                    td.onclick = ()=>clickCell(r,c);
                    tr.appendChild(td);
                }
                tbl.appendChild(tr);
            }
            container.innerHTML = "";
            container.appendChild(tbl);
        }

        function clickCell(r,c){
            if(gameOver) return;
            if(isFlagMode){
                // 标记/取消地雷旗帜
                flagged[r][c] = !flagged[r][c];
                renderBoard();
                if(checkWin()){
                    gameOver = true;
                    setTimeout(()=>alert("🎉胜利！所有地雷标记完成"),100);
                }
            }else{
                if(flagged[r][c]) return;
                if(mine[r][c]){
                    gameOver = true;
                    alert("💥游戏失败，踩到地雷！");
                    return;
                    open(r,c);
                 renderBoard();
                 if(checkWin()){
                     gameOver = true;
                     setTimeout(()=>alert("🎉胜利！所有地雷标记完成"),100);
                 }
             }
         }
         flagBtn.onclick = ()=>{
             isFlagMode = !isFlagMode;
             tipEl.innerText = isFlagMode ? "当前：标记雷模式（点击插红旗）" : "当前：正常点开模式";
         }
         resetBtn.onclick = initGame;
         initGame();
     </script>
 </body>
 </html>
                }
